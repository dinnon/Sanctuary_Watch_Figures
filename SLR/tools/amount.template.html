<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amount of relative sea level change</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:#263c4c;font:13px system-ui,Segoe UI,Arial,sans-serif}body{display:flex;flex-direction:column}
#chart{width:100%;height:auto;flex:1 1 auto;min-height:300px;overflow:hidden}#plotarea{position:relative;width:100%;height:calc(100% - 95px)}canvas{display:block;width:100%;height:100%;touch-action:none}
#tip{display:none;position:absolute;pointer-events:none;background:white;border-radius:4px;box-shadow:0 2px 12px #263c4c35;padding:7px 9px;white-space:nowrap;font-size:12px}
#error{display:none;position:absolute;inset:25% 10%;align-items:center;justify-content:center;text-align:center;color:#526575;line-height:1.5}
#mode{height:37px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid #edf1f3;color:#526575}#mode button{font:inherit;padding:4px 10px;border:1px solid #c9d8df;border-radius:4px;background:#fff;color:#245b72;cursor:pointer}#mode button[aria-pressed="true"]{background:#245b72;color:#fff}#years{height:58px;display:flex;align-items:center;gap:12px;padding:3px 18px 5px 64px;color:#526575;font-size:12px;border-top:1px solid #edf1f3}#years label{display:flex;align-items:center;gap:5px;flex:1;min-width:0}#years output{font-variant-numeric:tabular-nums;color:#263c4c;min-width:34px}#years input{flex:1;min-width:35px;accent-color:#ba5d30}#reset{font:inherit;color:#245b72;background:white;border:1px solid #c9d8df;border-radius:4px;padding:5px 8px;cursor:pointer;white-space:nowrap}#reset:hover{background:#f0f6f8}@media(max-width:500px){#years{padding-left:10px;gap:6px;font-size:11px}#years label{gap:3px}#reset{padding:4px}}
</style></head><body><div id="chart"><div id="mode">Baseline <button id="ntde" aria-pressed="true" type="button">1983–2001</button><button id="por" aria-pressed="false" type="button">First five years</button></div><div id="plotarea"><canvas id="plot" role="img" aria-label="NOAA monthly mean sea level and published amount of change. Hover for values and use the year sliders to explore."></canvas><div id="tip"></div><div id="error">Data are unavailable for this station.</div></div><div id="years"><label>From <input id="from" type="range" aria-label="First year"><output id="fromYear"></output></label><label>To <input id="to" type="range" aria-label="Last year"><output id="toYear"></output></label><button id="reset" type="button">All years</button></div></div>
<script>
const BUNDLED=__BUNDLED_SNAPSHOTS__;
__AMOUNT_DATA_JS__
const params=new URLSearchParams(location.search),station=params.get('station')||params.get('id')||'9440910';
const validId=/^\d{7}$/.test(station),FT=NOAAAmountData.FT;
const box=document.getElementById('plotarea'),canvas=document.getElementById('plot'),tip=document.getElementById('tip'),error=document.getElementById('error'),from=document.getElementById('from'),to=document.getElementById('to'),fromYear=document.getElementById('fromYear'),toYear=document.getElementById('toYear');
let data=null,limits=null,geometry=null,point=null,drag=null,baselineMode='ntde',dataKind='';
const label=r=>r.y+'-'+String(r.m).padStart(2,'0');
const signed=value=>(value>0?'+':'')+(Object.is(value,-0)?0:value).toFixed(3)+' ft';
const validData=v=>NOAAAmountData.valid(v,station);
const cacheKey=()=> 'noaa-observed-sl-v2-'+station;
function cached(){try{const v=JSON.parse(localStorage.getItem(cacheKey()));return validData(v)?v:null}catch{return null}}
function save(v){try{localStorage.setItem(cacheKey(),JSON.stringify(v))}catch(e){console.warn('Could not cache station',e)}}
function syncYears(){if(!data)return;from.min=to.min=data.rows[0].y;from.max=to.max=data.rows.at(-1).y;from.value=data.rows[limits[0]].y;to.value=data.rows[limits[1]].y;fromYear.value=from.value;toYear.value=to.value}
function use(v,kind){
 data={...v,rows:v.monthly.data.map(r=>({y:r.year,m:r.month,raw:r.msl}))};dataKind=kind;
 limits=[0,data.rows.length-1];point=null;tip.style.display='none';error.style.display='none';
 document.title='Amount of relative sea level change at '+v.name;
 canvas.setAttribute('aria-label',v.name+' monthly mean sea level and NOAA published change. Hover for values and use the year sliders to explore.');
 if(parent!==window)parent.postMessage({type:'noaa-station-name',station,name:v.name},'*');
 syncYears();draw();
}
function bestSaved(){const built=BUNDLED[station],local=cached();if(validData(local)&&(!validData(built)||NOAAAmountData.newer(local,built)))return [local,'Cached'];return validData(built)?[built,'Saved']:null}
async function get(url,signal){const r=await fetch(url,{signal,cache:'no-store'});if(!r.ok)throw Error('NOAA HTTP '+r.status);return r.json()}
function fail(message){error.textContent=message;error.style.display='flex';return}
async function refresh(){
 if(!validId){fail('Enter a seven-digit NOAA station ID.');return}
 const saved=bestSaved();if(saved)use(...saved);
 const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),15000),urls=NOAAAmountData.urls(station);
 try{
  const [s,m]=await Promise.all([get(urls.summary,abort.signal),get(urls.monthly,abort.signal)]);
  const live=NOAAAmountData.make(station,s,m);
  if(saved&&live.latest_month<saved[0].latest_month)throw Error('NOAA response older than saved data');
  save(live);use(live,'Live');
 }catch(e){
  if(saved){dataKind='Saved · live refresh unavailable';}
  else fail('Data are unavailable for this station.');
  console.warn('NOAA observed sea level request',e);
 }finally{clearTimeout(timer);abort.abort()}
}
function summary(){return NOAAAmountData.comparison(data,baselineMode)}
function draw(){
 const w=box.clientWidth,h=box.clientHeight,dpr=devicePixelRatio||1;if(!w||!h)return;
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);geometry=null;if(!data||!limits)return;
 const v=data.rows.slice(limits[0],limits[1]+1),c=summary(),levels=NOAAAmountData.levels(data,baselineMode);
 const left=w<420?52:66,right=20,top=56,bottom=48,pw=Math.max(10,w-left-right),ph=Math.max(10,h-top-bottom);
 const num=r=>r.y+(r.m-.5)/12,x0=num(v[0])-.04,x1=num(v.at(-1))+.04;
 const vals=v.filter(r=>r.raw!==null).map(r=>r.raw*FT);
 if(levels)vals.push(levels.base*FT,levels.recent*FT);
 ctx.fillStyle='#526575';ctx.font='11px system-ui';ctx.textAlign='left';ctx.textBaseline='top';
 ctx.fillText('Monthly MSL (ft; station datum)',left,5);
 ctx.fillStyle=c.available?'#bc353d':'#526575';ctx.font='bold 12px system-ui';
 ctx.fillText(c.available?'Change: '+signed(c.change*FT):'NOAA change amount unavailable',left,25);
 if(!vals.length){ctx.fillStyle='#526575';ctx.font='12px system-ui';ctx.fillText('No monthly observations in this view.',left,top+20);return}
 const spread=Math.max(...vals)-Math.min(...vals),tick=spread>1.5?.5:spread>.7?.2:.1;
 let lo=Math.floor((Math.min(...vals)-tick*.3)/tick)*tick,hi=Math.ceil((Math.max(...vals)+tick*.3)/tick)*tick;if(hi===lo)hi=lo+tick;
 const X=r=>left+(num(r)-x0)/(x1-x0)*pw,Y=a=>top+(hi-a)/(hi-lo)*ph;
 geometry={v,X,Y,left,pw};ctx.font='11px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
 for(let n=Math.ceil(lo/tick);n<=Math.floor(hi/tick);n++){const a=n*tick,y=Y(a);ctx.strokeStyle='#e7ecef';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(left+pw,y);ctx.stroke();ctx.fillStyle='#526575';ctx.fillText(a.toFixed(1),left-7,y)}
 ctx.textAlign='center';ctx.textBaseline='top';const span=x1-x0,step=span<8?1:span<18?2:span<35?5:10;
 for(let year=Math.ceil(x0/step)*step;year<=x1;year+=step){ctx.fillStyle='#526575';ctx.fillText(year,left+(year-x0)/span*pw,top+ph+9)}
 ctx.strokeStyle='#57a5d4';ctx.lineWidth=1.25;ctx.beginPath();let last=null;
 for(const r of v){if(r.raw===null){last=null;continue}if(!last||r.y*12+r.m-(last.y*12+last.m)!==1)ctx.moveTo(X(r),Y(r.raw*FT));else ctx.lineTo(X(r),Y(r.raw*FT));last=r}ctx.stroke();
 if(point&&v.includes(point)&&point.raw!==null){ctx.fillStyle='#245b72';ctx.beginPath();ctx.arc(X(point),Y(point.raw*FT),4,0,7);ctx.fill()}
 ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='10px system-ui';
 // Horizontal markers are positioned from published changes, never a new fit.
 if(levels){
  function bar(value,a,b,width=4,dash=[]){
   a=Math.max(a,x0);b=Math.min(b,x1);if(b<=a)return;
   ctx.strokeStyle='#202c32';ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();
   ctx.moveTo(left+(a-x0)/span*pw,Y(value*FT));ctx.lineTo(left+(b-x0)/span*pw,Y(value*FT));ctx.stroke();ctx.setLineDash([]);
  }
  bar(levels.base,levels.start,levels.recentStop,1,[5,4]);
  bar(levels.base,levels.start,levels.stop);
  bar(levels.recent,levels.recentStart,levels.recentStop);
 }
 const items=[['#57a5d4','Monthly MSL'],['#202c32','Baseline / five-year mean']];
 let x=left,y=h-10;for(const [color,text]of items){if(x+ctx.measureText(text).width+15>w-4)break;ctx.fillStyle=color;ctx.fillRect(x,y-2,9,3);ctx.fillStyle='#526575';ctx.fillText(text,x+12,y);x+=ctx.measureText(text).width+25}
}
function nearest(px){return geometry.v.reduce((a,b)=>Math.abs(geometry.X(b)-px)<Math.abs(geometry.X(a)-px)?b:a)}
function hover(e){if(!geometry||drag)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left;if(x<geometry.left||x>geometry.left+geometry.pw){tip.style.display='none';point=null;draw();return}point=nearest(x);tip.textContent=`${label(point)} · ${point.raw===null?'missing':(point.raw*FT).toFixed(3)+' ft'}`;tip.style.display='block';tip.style.left=Math.max(4,Math.min(rect.width-tip.offsetWidth-4,geometry.X(point)+10))+'px';tip.style.top=point.raw===null?'32px':Math.max(28,geometry.Y(point.raw*FT)-37)+'px';draw()}
canvas.addEventListener('pointermove',e=>{if(!drag)hover(e)});canvas.addEventListener('pointerdown',e=>{if(!geometry)return;drag={x:e.clientX};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',e=>{if(!drag||!geometry)return;const rect=canvas.getBoundingClientRect(),a=drag.x-rect.left,b=e.clientX-rect.left;drag=null;if(Math.abs(a-b)<12){hover(e);return}const first=nearest(Math.max(geometry.left,Math.min(a,b))),last=nearest(Math.min(geometry.left+geometry.pw,Math.max(a,b)));let i=data.rows.indexOf(first),j=data.rows.indexOf(last);if(j-i>=2){limits=[i,j];syncYears();tip.style.display='none';point=null;draw()}});
canvas.addEventListener('pointercancel',()=>{drag=null});canvas.addEventListener('pointerleave',()=>{if(!drag){tip.style.display='none';point=null;draw()}});
function changeYears(changed){if(!data)return;if(+from.value>+to.value){if(changed===from)to.value=from.value;else from.value=to.value}const a=+from.value,b=+to.value;let i=data.rows.findIndex(r=>r.y>=a),j=data.rows.length-1;while(j>0&&data.rows[j].y>b)j--;if(i<0)i=data.rows.length-1;if(j<i)j=i;limits=[i,j];fromYear.value=from.value;toYear.value=to.value;point=null;tip.style.display='none';draw()}
from.addEventListener('input',()=>changeYears(from));to.addEventListener('input',()=>changeYears(to));
for(const mode of ['ntde','por'])document.getElementById(mode).addEventListener('click',()=>{baselineMode=mode;for(const m of ['ntde','por'])document.getElementById(m).setAttribute('aria-pressed',String(m===mode));point=null;tip.style.display='none';draw()});
document.getElementById('reset').addEventListener('click',()=>{if(data){limits=[0,data.rows.length-1];syncYears();draw()}});
canvas.addEventListener('dblclick',()=>{if(data){limits=[0,data.rows.length-1];syncYears();draw()}});
new ResizeObserver(draw).observe(box);refresh();
</script></body></html>
