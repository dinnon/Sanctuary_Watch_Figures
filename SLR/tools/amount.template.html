<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amount of relative sea level change</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:#263c4c;font:13px system-ui,Segoe UI,Arial,sans-serif}
#chart{width:100%;height:100%;min-height:300px}#plotarea{position:relative;width:100%;height:calc(100% - 95px)}canvas{display:block;width:100%;height:100%;touch-action:none}
#status{display:none;position:absolute;top:8px;right:10px;background:#ffffffeb;border:1px solid #dde7eb;border-radius:4px;padding:5px 8px;color:#526575;font-size:11px;pointer-events:none;max-width:55%;text-align:right}
#tip{display:none;position:absolute;pointer-events:none;background:white;border-radius:4px;box-shadow:0 2px 12px #263c4c35;padding:7px 9px;white-space:nowrap;font-size:12px}
#error{display:none;position:absolute;inset:20%;align-items:center;justify-content:center;text-align:center;color:#526575;line-height:1.5}
#mode{height:37px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid #edf1f3;color:#526575}#mode button{font:inherit;padding:4px 10px;border:1px solid #c9d8df;border-radius:4px;background:#fff;color:#245b72;cursor:pointer}#mode button[aria-pressed="true"]{background:#245b72;color:#fff}#years{height:58px;display:flex;align-items:center;gap:12px;padding:3px 18px 5px 64px;color:#526575;font-size:12px;border-top:1px solid #edf1f3}#years label{display:flex;align-items:center;gap:5px;flex:1;min-width:0}#years output{font-variant-numeric:tabular-nums;color:#263c4c;min-width:34px}#years input{flex:1;min-width:35px;accent-color:#ba5d30}#reset{font:inherit;color:#245b72;background:white;border:1px solid #c9d8df;border-radius:4px;padding:5px 8px;cursor:pointer;white-space:nowrap}#reset:hover{background:#f0f6f8}@media(max-width:500px){#years{padding-left:10px;gap:6px;font-size:11px}#years label{gap:3px}#reset{padding:4px}}
</style></head><body><div id="chart"><div id="mode">Baseline <button id="ntde" aria-pressed="true" type="button">1983–2001</button><button id="por" aria-pressed="false" type="button">First five years</button></div><div id="plotarea"><canvas id="plot" role="img" aria-label="NOAA monthly mean sea level and five-year average. Hover for values and use the year sliders to explore."></canvas><div id="status" role="status" aria-live="polite"></div><div id="tip"></div><div id="error">No saved data for this station and NOAA is unavailable, or the station has no published sea level series.</div></div><div id="years"><label>From <input id="from" type="range" aria-label="First year"><output id="fromYear"></output></label><label>To <input id="to" type="range" aria-label="Last year"><output id="toYear"></output></label><button id="reset" type="button">All years</button></div></div>
<script>
const BUNDLED=__BUNDLED_SNAPSHOTS__;
const api='https://api.tidesandcurrents.noaa.gov/dpapi/prod/webapi/product/sealvltrends.json';
const params=new URLSearchParams(location.search),station=params.get('station')||params.get('id')||'9440910';
const validId=/^\d{7}$/.test(station);
const box=document.getElementById('plotarea'),canvas=document.getElementById('plot'),status=document.getElementById('status'),tip=document.getElementById('tip'),error=document.getElementById('error'),from=document.getElementById('from'),to=document.getElementById('to'),fromYear=document.getElementById('fromYear'),toYear=document.getElementById('toYear');
let data=null,limits=null,geometry=null,point=null,drag=null,baselineMode="ntde";
const label=r=>`${r.y}-${String(r.m).padStart(2,'0')}`;
function validRows(rows){if(!Array.isArray(rows)||rows.length<12)return false;let seen=new Set();for(const r of rows){let k=label(r);if(!Number.isInteger(r.y)||!Number.isInteger(r.m)||r.m<1||r.m>12||seen.has(k)||!['obs','raw','trend','lo','hi'].every(p=>r[p]===null||typeof r[p]==='number'&&Number.isFinite(r[p])))return false;seen.add(k)}return true}
function validData(v){return v&&v.station===station&&validRows(v.rows)&&/^\d{4}-\d\d$/.test(v.latest_month)&&Number.isFinite(v.trend_mm_year)}
function cacheKey(){return `noaa-sea-level-v1-${station}`}
function cached(){try{const v=JSON.parse(localStorage.getItem(cacheKey()));return validData(v)?v:null}catch{return null}}
function save(v){try{localStorage.setItem(cacheKey(),JSON.stringify(v))}catch(e){console.warn('Could not cache station',e)}}
function syncYears(){if(!data)return;const first=data.rows[0].y,last=data.rows[data.rows.length-1].y;from.min=to.min=first;from.max=to.max=last;from.value=data.rows[limits[0]].y;to.value=data.rows[limits[1]].y;fromYear.value=from.value;toYear.value=to.value}
function use(v,kind){data=v;data.rows.sort((a,b)=>a.y-b.y||a.m-b.m);limits=[0,data.rows.length-1];point=null;tip.style.display='none';error.style.display='none';status.style.display=kind==='Live'?'none':'block';status.textContent=kind==='Live'?'':'Saved data';if(typeof v.name==='string'&&v.name.trim()){document.title=`Amount of relative sea level change at ${v.name}`;canvas.setAttribute('aria-label',`${v.name} monthly mean sea level and five-year average. Hover for values and use the year sliders to explore.`);if(parent!==window)parent.postMessage({type:'noaa-station-name',station,name:v.name},'*')}syncYears();draw()}
function bestSaved(){const built=BUNDLED[station],local=cached();if(validData(local)&&(!validData(built)||local.latest_month>=built.latest_month))return [local,'Cached'];return validData(built)?[built,'Saved']:null}
async function get(url,signal){const response=await fetch(url,{signal,cache:'no-store'});if(!response.ok)throw Error(`NOAA HTTP ${response.status}`);return response.json()}
async function refresh(){if(!validId){error.style.display='flex';return}const saved=bestSaved();if(saved)use(...saved);else{status.style.display='block';status.textContent='Checking NOAA…'}
 const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),15000);
 try{const [m,t]=await Promise.all([get(`${api}?station=${station}&details=monthlymeans&units=metric&trendType=SINGLE`,abort.signal),get(`${api}?station=${station}`,abort.signal)]);
  const tr=t.SeaLvlTrends?.find(x=>x.stationId===station);
  if(m.stationID!==station||m.units!=='meters'||m.trendType!=='SINGLE'||!tr||tr.trendUnits!=='inches/decade'||!Number.isFinite(tr.trend)||!Array.isArray(m.data))throw Error('No supported trend');
  const rows=m.data.map(r=>({y:r.year,m:r.month,obs:r.mslDeseasonalized,raw:r.msl,trend:r.trendLine,lo:r.lowerConfidence,hi:r.upperConfidence}));
  if(!validRows(rows))throw Error('Invalid monthly observations');rows.sort((a,b)=>a.y-b.y||a.m-b.m);
  const live={station,name:m.stationName||station,latest_month:label(rows[rows.length-1]),trend_mm_year:tr.trend*2.54,trend_end:tr.endDate,retrieved_utc:new Date().toISOString(),rows};
  if(saved&&live.latest_month<saved[0].latest_month)throw Error('NOAA response older than saved data');
  save(live);use(live,'Live');
 }catch(e){if(saved){status.style.display='block';status.textContent='Saved data · NOAA unavailable'}else{status.style.display='none';error.style.display='flex'}console.warn('NOAA sea level request',e)}finally{clearTimeout(timer)}
}
function summary(){
 const rows=data.rows.filter(r=>r.raw!==null),years=[...new Set(rows.map(r=>r.y))].sort((a,b)=>a-b);
 const full=years.filter(y=>rows.filter(r=>r.y===y).length===12);
 const end=full[full.length-1];if(end===undefined)return null;
 const recent=rows.filter(r=>r.y>=end-4&&r.y<=end);
 if(recent.length<36)return null;
 const recentMean=recent.reduce((sum,r)=>sum+r.raw,0)/recent.length;
 const ntde=rows.filter(r=>r.y>=1983&&r.y<=2001);
 const first=full[0],early=rows.filter(r=>r.y>=first&&r.y<first+5);
 const hasEpoch=ntde.length>=120;
 let start=baselineMode==='ntde'&&hasEpoch?1983:first;
 let base=baselineMode==='ntde'&&hasEpoch?0:early.reduce((sum,r)=>sum+r.raw,0)/early.length;
 return {start,end,recentMean,base,baselineLabel:baselineMode==='ntde'&&hasEpoch?'1983–2001 baseline':`${first}–${first+4} average`,recentLabel:`${end-4}–${end} average`};
}
function draw(){const w=box.clientWidth,h=box.clientHeight,dpr=devicePixelRatio||1;if(!w||!h)return;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!data||!limits)return;
 const all=data.rows,baseInfo=summary(),view=all.slice(limits[0],limits[1]+1),v=view.filter(r=>r.y>=(baseInfo?.start||view[0]?.y));
 if(!v.length||!baseInfo)return;const left=w<420?52:66,right=w<480?23:60,top=46,bottom=42,pw=Math.max(10,w-left-right),ph=Math.max(10,h-top-bottom),num=r=>r.y+(r.m-.5)/12,x0=num(v[0]),x1=num(v[v.length-1]);
 const vals=v.map(r=>r.raw).filter(x=>x!==null).map(x=>x*1000);vals.push(baseInfo.base*1000,baseInfo.recentMean*1000);let lo=Math.floor((Math.min(...vals)-20)/100)*100,hi=Math.ceil((Math.max(...vals)+20)/100)*100;if(hi===lo)hi=lo+100;
 const X=r=>left+(num(r)-x0)/Math.max(.1,x1-x0)*pw,Y=a=>top+(hi-a)/(hi-lo)*ph;geometry={v,X,Y,left,pw};ctx.font='11px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
 const tick=(hi-lo)>650?200:100;for(let a=Math.ceil(lo/tick)*tick;a<=hi;a+=tick){const y=Y(a);ctx.strokeStyle='#e7ecef';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(left+pw,y);ctx.stroke();ctx.fillStyle='#526575';ctx.fillText(a,left-7,y)}
 ctx.textAlign='center';ctx.textBaseline='top';const span=x1-x0,step=span<8?1:span<18?2:span<35?5:10;for(let year=Math.ceil(x0/step)*step;year<=x1;year+=step){const x=left+(year-x0)/Math.max(.1,span)*pw;ctx.fillStyle='#526575';ctx.fillText(year,x,top+ph+9)}
 ctx.fillStyle='#526575';ctx.textAlign='left';ctx.fillText('Monthly MSL (mm)',left,4);
 ctx.strokeStyle='#57a5d4';ctx.lineWidth=1.25;ctx.beginPath();let last=null;for(const r of v){if(r.raw===null){last=null;continue}if(!last||num(r)-num(last)>.13)ctx.moveTo(X(r),Y(r.raw*1000));else ctx.lineTo(X(r),Y(r.raw*1000));last=r}ctx.stroke();
 function horizontal(value,startYear,endYear,color,width,dash=[]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();const xA=Math.max(left,left+(startYear-x0)/Math.max(.1,x1-x0)*pw),xB=Math.min(left+pw,left+(endYear-x0)/Math.max(.1,x1-x0)*pw);if(xB>xA){ctx.moveTo(xA,Y(value*1000));ctx.lineTo(xB,Y(value*1000));ctx.stroke()}ctx.setLineDash([])}
 horizontal(baseInfo.base,x0,x1,'#89949a',1,[5,4]);horizontal(baseInfo.base,baseInfo.start,baselineMode==='ntde'?2002:baseInfo.start+5,'#202c32',3);horizontal(baseInfo.recentMean,baseInfo.end-4,baseInfo.end+1,'#202c32',3);
 const delta=(baseInfo.recentMean-baseInfo.base)*1000,redX=left+pw+8;ctx.strokeStyle='#d84a50';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(redX,Y(baseInfo.base*1000));ctx.lineTo(redX,Y(baseInfo.recentMean*1000));ctx.stroke();ctx.fillStyle='#bc353d';ctx.textAlign='right';ctx.font='bold 12px system-ui';ctx.fillText(`Change ${delta>=0?'+':''}${Math.round(delta)} mm`,left+pw,25);
 if(point&&v.includes(point)&&point.raw!==null){ctx.fillStyle='#245b72';ctx.beginPath();ctx.arc(X(point),Y(point.raw*1000),4,0,7);ctx.fill()}
 ctx.textAlign='left';ctx.font='11px system-ui';const items=[['#57a5d4','Monthly'],['#202c32','Five-year mean'],['#89949a','Baseline'],['#d84a50','Change']];let x=left,y=h-11;for(const [color,label]of items){ctx.fillStyle=color;ctx.fillRect(x,y-2,11,3);ctx.fillStyle='#526575';ctx.fillText(label,x+14,y);x+=label.length*5.4+31}
}
function nearest(px){return geometry.v.reduce((a,b)=>Math.abs(geometry.X(b)-px)<Math.abs(geometry.X(a)-px)?b:a)}
function hover(e){if(!geometry||drag)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left;if(x<geometry.left||x>geometry.left+geometry.pw){tip.style.display='none';point=null;draw();return}point=nearest(x);tip.textContent=`${label(point)} · ${point.raw===null?'missing':(point.raw*1000).toFixed(0)+' mm'}`;tip.style.display='block';tip.style.left=Math.max(4,Math.min(rect.width-tip.offsetWidth-4,geometry.X(point)+10))+'px';tip.style.top=point.raw===null?'32px':Math.max(28,geometry.Y(point.raw*1000)-37)+'px';draw()}
canvas.addEventListener('pointermove',e=>{if(!drag)hover(e)});canvas.addEventListener('pointerdown',e=>{if(!geometry)return;drag={x:e.clientX};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',e=>{if(!drag||!geometry)return;const rect=canvas.getBoundingClientRect(),a=drag.x-rect.left,b=e.clientX-rect.left;drag=null;if(Math.abs(a-b)<12){hover(e);return}const first=nearest(Math.max(geometry.left,Math.min(a,b))),last=nearest(Math.min(geometry.left+geometry.pw,Math.max(a,b)));let i=data.rows.indexOf(first),j=data.rows.indexOf(last);if(j-i>=2){limits=[i,j];syncYears();tip.style.display='none';point=null;draw()}});
canvas.addEventListener('pointercancel',()=>{drag=null});canvas.addEventListener('pointerleave',()=>{if(!drag){tip.style.display='none';point=null;draw()}});
function changeYears(changed){if(!data)return;if(+from.value>+to.value){if(changed===from)to.value=from.value;else from.value=to.value}const a=+from.value,b=+to.value;let i=data.rows.findIndex(r=>r.y>=a),j=data.rows.length-1;while(j>0&&data.rows[j].y>b)j--;if(i<0)i=data.rows.length-1;if(j<i)j=i;limits=[i,j];fromYear.value=from.value;toYear.value=to.value;point=null;tip.style.display='none';draw()}
from.addEventListener('input',()=>changeYears(from));to.addEventListener('input',()=>changeYears(to));
for(const mode of ['ntde','por'])document.getElementById(mode).addEventListener('click',()=>{baselineMode=mode;for(const m of ['ntde','por'])document.getElementById(m).setAttribute('aria-pressed',String(m===mode));point=null;tip.style.display='none';draw()});
document.getElementById('reset').addEventListener('click',()=>{if(data){limits=[0,data.rows.length-1];syncYears();draw()}});
canvas.addEventListener('dblclick',()=>{if(data){limits=[0,data.rows.length-1];syncYears();draw()}});
new ResizeObserver(draw).observe(box);refresh();
</script></body></html>
